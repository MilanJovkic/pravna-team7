name: final-evaluation-ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  final-validation:
    runs-on: windows-latest
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5433
      POSTGRES_DB: pravna_cbr
      POSTGRES_USER: pravna_user
      POSTGRES_PASSWORD: pravna_pass
      TEST_API_BASE_URL: http://127.0.0.1:8000/api
      OPENAI_API_KEY: dummy
      OPENROUTER_API_KEY: dummy
      GITHUB_TOKEN: dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt

      - name: Start PostgreSQL with Docker Compose
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL
        shell: pwsh
        run: |
          $max = 30
          for ($i = 0; $i -lt $max; $i++) {
            docker exec pravna-postgres pg_isready -U pravna_user -d pravna_cbr
            if ($LASTEXITCODE -eq 0) {
              Write-Host "PostgreSQL is ready"
              exit 0
            }
            Start-Sleep -Seconds 2
          }
          Write-Error "PostgreSQL did not become ready in time"
          exit 1

      - name: Build jColibri CBR jar
        run: |
          cd cbr-jcolibri
          mvn -q -DskipTests package

      - name: Run single-command CI validation
        run: python scripts/run_ci_validation.py

      - name: Upload final evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-evaluation-report
          path: |
            output/final_eval_report.json
            output/final_eval_report.md

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v
